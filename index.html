<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashdeck</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5FB;--ink:#101B3B;--mute:#55618A;--card:#FFFFFF;--line:#D5DBEE;--brand:#2B4EFF;--on-brand:#FFFFFF;--sun:#FFD23F;--ok:#0F7A52;--bad:#C72E35;--shadow:#101B3B33;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0C1230;--ink:#EAF0FF;--mute:#9AA7CF;--card:#17204A;--line:#2A3566;--brand:#7C93FF;--on-brand:#0C1230;--ok:#4FD39A;--bad:#FF8A8F;--shadow:#00000066}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0C1230;--ink:#EAF0FF;--mute:#9AA7CF;--card:#17204A;--line:#2A3566;--brand:#7C93FF;--on-brand:#0C1230;--ok:#4FD39A;--bad:#FF8A8F;--shadow:#00000066}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:18px 20px;max-width:760px;margin:0 auto}
.logo{font:800 22px 'Bricolage Grotesque',sans-serif;margin-right:auto}
.logo span{display:inline-block;background:var(--sun);color:#101B3B;border-radius:8px;padding:0 8px;transform:rotate(-3deg)}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{font:700 15px 'DM Sans',sans-serif;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:12px 20px 48px;display:flex;flex-direction:column;align-items:center;gap:22px}
h1{font:800 clamp(28px,6vw,40px)/1.1 'Bricolage Grotesque',sans-serif;margin:0;align-self:flex-start}
.meta{color:var(--mute);font-weight:500;align-self:flex-start}
.stack{position:relative;width:min(560px,100%);margin-top:10px}
.stack::before{content:"";position:absolute;inset:0;background:var(--sun);border-radius:28px;transform:rotate(-2.5deg) translateY(10px)}
.card{position:relative;display:block;width:100%;aspect-ratio:3/2;perspective:1200px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
.face{position:absolute;inset:0;display:grid;place-items:center;padding:24px;border-radius:28px;background:var(--card);border:2px solid var(--line);box-shadow:0 18px 40px -20px var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .5s;font:800 clamp(34px,8vw,62px)/1.05 'Bricolage Grotesque',sans-serif;text-align:center;overflow-wrap:anywhere}
.back{transform:rotateY(180deg);background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.card.flip .front{transform:rotateY(-180deg)}
.card.flip .back{transform:rotateY(0)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font:700 17px 'DM Sans',sans-serif;background:var(--brand);color:var(--on-brand);border:2px solid var(--brand);border-radius:14px;padding:13px 24px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.link{font:500 15px 'DM Sans',sans-serif;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.prompt{font:800 clamp(30px,7vw,52px)/1.1 'Bricolage Grotesque',sans-serif;text-align:center;margin:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(560px,100%)}
.opt{font:700 19px 'DM Sans',sans-serif;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:18px 12px;cursor:pointer;min-height:68px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.say{width:min(560px,100%);font:700 24px 'DM Sans',sans-serif;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.fb{min-height:30px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.edit{width:100%;display:flex;flex-direction:column;gap:16px}
.edit label{display:flex;flex-direction:column;gap:6px;font-weight:700}
.edit input,.edit textarea{font:500 17px 'DM Sans',sans-serif;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.hint{color:var(--mute);margin:0;font-size:15px}
.err{color:var(--bad);font-weight:700;margin:0}
[hidden]{display:none!important}
.face small{display:block;font:500 17px/1.3 'DM Sans',sans-serif;margin-top:14px;opacity:.9}
#rp,#lk{font-size:15px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(640px,100%)}
.mc{display:flex;flex-direction:column;gap:10px}
.mt .opt{font-size:17px;padding:14px 8px;min-height:60px;overflow-wrap:anywhere}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 18%,var(--card))}
.opt:disabled{color:var(--ink);cursor:default}
.big{font:800 clamp(56px,14vw,110px)/1 'Bricolage Grotesque',sans-serif}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.face{transition:none}}
</style>
</head>
<body>
<header>
  <div class="logo"><span>Flash</span>deck</div>
  <nav id="tabs" aria-label="Practice mode" hidden>
    <button data-m="cards">Cards</button><button data-m="quiz">Quiz</button><button data-m="write">Write</button><button data-m="match">Match</button><button data-m="def">Define</button><button data-m="edit">Edit words</button>
  </nav>
</header>
<main id="stage"></main>
<script>
var KEY='flashdeck.v1';
var SAMPLE={title:"Success & Hard Work",text:"success - успех | achieving something you wanted\nachievement - достижение | something important you have achieved\ngoal - цель | something you want to achieve\neffort - усилие | the work you put into something\nfailure - неудача, провал | not achieving what you wanted\ntalent - талант | a natural ability\nskill - навык | an ability you develop through practice\nmotivation - мотивация | the reason/energy that makes you act\nexperience - опыт | knowledge gained from doing something\nhard work - тяжёлый труд, работа | putting a lot of effort into something\nambitious - амбициозный | wanting to achieve a lot\ndetermined - целеустремлённый | not giving up easily\nachieve a goal - достичь цели\nwork hard - тяжело работать\ngive up - сдаться\nlearn from your mistakes - учиться на своих ошибках\nreach your potential - реализовать свой потенциал\novercome a problem - преодолеть проблему\nmake progress - прогрессировать\nkeep trying - продолжать пробовать"};
var deck=load()||SAMPLE,words=[],order=[],i=0,mode='edit',dir='en',known=new Set(),score=0,missed=[],answered=false;
var $=function(s){return document.querySelector(s)},stage=$('#stage');
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(deck))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function parse(t){return t.split(/\n/).map(function(l){return l.trim()}).filter(Boolean).map(function(l){var p=l.split(/\s+[-–—=|]\s+|\t|\s*\|\s*/);return p.length>1?{en:p[0].trim(),tr:p[1].trim(),df:p.slice(2).join(' ').trim()}:null}).filter(Boolean)}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function q(w){return dir==='en'?w.en:w.tr}
function a(w){return dir==='en'?w.tr:w.en}
function norm(s){return s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ').trim()}
var BASE=location.href.split('#')[0];
function stats(){try{return JSON.parse(localStorage.getItem('flashdeck.stats'))||{}}catch(e){return{}}}
function rec(w,ok){var S=stats(),r=S[w.en]||(S[w.en]={a:0,w:0});r.a++;if(!ok)r.w++;try{localStorage.setItem('flashdeck.stats',JSON.stringify(S))}catch(e){}}
function nm(){try{return localStorage.getItem('flashdeck.name')||''}catch(e){return''}}
function b64u(b){var s='';b.forEach(function(c){s+=String.fromCharCode(c)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var s=atob(t),u=new Uint8Array(s.length);for(var k=0;k<s.length;k++)u[k]=s.charCodeAt(k);return u}
async function pack(d){var j=new TextEncoder().encode(JSON.stringify(d));if(window.CompressionStream){var r=new Blob([j]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64u(new Uint8Array(await new Response(r).arrayBuffer()))}return 'u'+b64u(j)}
async function unpack(t){var b=unb64u(t.slice(1));if(t[0]==='z'){var r=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));b=new Uint8Array(await new Response(r).arrayBuffer())}return JSON.parse(new TextDecoder().decode(b))}
function welcome(){stage.innerHTML=head()+'<div class="meta">'+words.length+' слов и выражений</div><div class="edit"><label>Как тебя зовут?<input id="nm" value="'+esc(nm())+'" autocomplete="off"></label><div class="row" style="justify-content:flex-start"><button class="btn" id="st">Начать</button></div></div>';$('#st').onclick=function(){try{localStorage.setItem('flashdeck.name',$('#nm').value.trim())}catch(e){}begin();dir='en';setMode('cards')}}
function onlyDef(){if(mode==='def')order=order.filter(function(k){return words[k].df})}
function setMode(m){mode=m;onlyDef();$('#tabs').hidden=false;i=0;answered=false;score=0;missed=[];document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===m)});render()}
function begin(list){order=list||words.map(function(_,k){return k});i=0;known.clear();score=0;missed=[];onlyDef()}
function render(){
  if(mode==='edit')return edit();
  if(mode==='def'&&!order.length){stage.innerHTML=head()+'<p class="hint">В этом уроке нет определений. Добавь их через « | » в конце строки: word - перевод | definition</p>';return}
  if(i>=order.length)return done();
  var w=words[order[i]];
  if(mode==='match')return match();
  if(mode==='def')return def(w);
  if(mode==='cards')cards(w);else if(mode==='quiz')quiz(w);else write(w);
}
function edit(){
  $('#tabs').hidden=!words.length;
  stage.innerHTML='<h1>Set up your words</h1><div class="edit"><label>Deck name<input id="t" value="'+esc(deck.title)+'"></label><label>Words<textarea id="w" rows="12" spellcheck="false">'+esc(deck.text)+'</textarea></label><p class="hint">Одна строка — одно слово: english - перевод. Вместо дефиса можно писать «=» или «|».</p><p class="err" id="e"></p><div class="row" style="justify-content:flex-start"><button class="btn" id="go">Start practice</button><button class="btn ghost" id="mk">Сделать ссылку-урок</button></div><textarea id="lk" rows="4" readonly hidden></textarea></div>';
  $('#go').onclick=function(){var t=$('#w').value,p=parse(t);if(p.length<2){$('#e').textContent='Add at least 2 lines, for example: hat - капелюх';return}
    deck={title:$('#t').value.trim()||'My words',text:t};save();words=p;begin();dir='en';setMode('cards')};
  $('#mk').onclick=function(){var t=$('#w').value;if(parse(t).length<2){$('#e').textContent='Add at least 2 lines';return}pack({t:$('#t').value.trim()||'My words',x:t}).then(function(k){var b=$('#lk');b.hidden=false;b.value=BASE+'#'+k;b.focus();b.select()})};
}
function head(){return '<h1>'+esc(deck.title)+'</h1>'}
function cards(w){
  stage.innerHTML=head()+'<div class="meta">'+(i+1)+' of '+order.length+' · '+known.size+' known</div><div class="stack"><button class="card" id="c" aria-label="Flip the card"><span class="face front">'+esc(q(w))+'</span><span class="face back"><div>'+esc(a(w))+(w.df?'<small>'+esc(w.df)+'</small>':'')+'</div></span></button></div><div class="row"><button class="btn ghost" id="n">Still learning</button><button class="btn" id="y">Got it</button></div><div class="row"><button class="link" id="d">Showing '+(dir==='en'?'English first':'translation first')+'. Switch</button><button class="link" id="s">Shuffle</button></div>';
  $('#c').onclick=function(){this.classList.toggle('flip')};
  $('#y').onclick=function(){rec(w,true);known.add(order[i]);i++;render()};
  $('#n').onclick=function(){rec(w,false);i++;render()};
  $('#d').onclick=function(){dir=dir==='en'?'tr':'en';render()};
  $('#s').onclick=function(){order=shuffle(order);i=0;render()};
}
function def(w){
  var others=shuffle(words.filter(function(x){return x.df&&x.en!==w.en})).slice(0,3).map(function(x){return x.en}),opts=shuffle(others.concat(w.en));
  stage.innerHTML=head()+'<div class="meta">'+(i+1)+' of '+order.length+' · '+score+' correct</div><p class="hint">Which word matches the definition?</p><div class="prompt" style="font-size:clamp(22px,5vw,34px)">'+esc(w.df)+'</div><div class="opts">'+opts.map(function(o){return '<button class="opt">'+esc(o)+'</button>'}).join('')+'</div><div class="fb" id="f" aria-live="polite"></div><div class="row"><button class="btn" id="nx" hidden>Next</button></div>';
  document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
    if(answered)return;answered=true;var ok=b.textContent===w.en;rec(w,ok);
    if(ok)score++;else missed.push(order[i]);
    document.querySelectorAll('.opt').forEach(function(x){if(x.textContent===w.en)x.classList.add('ok');else if(x===b)x.classList.add('bad')});
    $('#f').className='fb '+(ok?'ok':'bad');$('#f').textContent=(ok?'Correct! ':'Not quite. Answer: '+w.en+' — ')+w.tr;$('#nx').hidden=false;$('#nx').focus()}});
  $('#nx').onclick=function(){answered=false;i++;render()};
}
function quiz(w){
  var right=a(w),others=shuffle(words.filter(function(x){return a(x)!==right})).slice(0,3).map(a),opts=shuffle(others.concat(right));
  stage.innerHTML=head()+'<div class="meta">'+(i+1)+' of '+order.length+' · '+score+' correct</div><div class="prompt">'+esc(q(w))+'</div><div class="opts">'+opts.map(function(o){return '<button class="opt">'+esc(o)+'</button>'}).join('')+'</div><div class="fb" id="f" aria-live="polite"></div><div class="row"><button class="btn" id="nx" hidden>Next</button></div>';
  document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
    if(answered)return;answered=true;var ok=b.textContent===right;rec(w,ok);
    if(ok)score++;else missed.push(order[i]);
    document.querySelectorAll('.opt').forEach(function(x){if(x.textContent===right)x.classList.add('ok');else if(x===b)x.classList.add('bad')});
    $('#f').className='fb '+(ok?'ok':'bad');$('#f').textContent=ok?'Correct!':'Not quite. Answer: '+right;$('#nx').hidden=false;$('#nx').focus()}});
  $('#nx').onclick=function(){answered=false;i++;render()};
}
function match(){
  var sz=order.length-i<=8?order.length-i:6,idx=order.slice(i,i+sz),L=shuffle(idx),R=shuffle(idx),sel=null,left=sz,bad={};
  function bt(k,side,t){return '<button class="opt" data-k="'+k+'" data-s="'+side+'">'+esc(t)+'</button>'}
  stage.innerHTML=head()+'<div class="meta">'+(i+1)+'–'+(i+sz)+' of '+order.length+' · '+score+' correct</div><p class="hint">Tap a word, then its translation</p><div class="mt"><div class="mc">'+L.map(function(k){return bt(k,'l',words[k].en)}).join('')+'</div><div class="mc">'+R.map(function(k){return bt(k,'r',words[k].tr)}).join('')+'</div></div><div class="fb" id="f" aria-live="polite"></div>';
  document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
    if(b.disabled)return;
    if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
    var l=b.dataset.s==='l'?b:sel,r=l===b?sel:b;sel.classList.remove('sel');sel=null;
    if(l.dataset.k===r.dataset.k){
      var k=+l.dataset.k,ok=!bad[k];l.classList.add('ok');r.classList.add('ok');l.disabled=r.disabled=true;rec(words[k],ok);
      if(ok)score++;else missed.push(k);
      if(--left===0){$('#f').className='fb ok';$('#f').textContent='Great!';i+=sz;setTimeout(render,800)}
    }else{
      bad[l.dataset.k]=1;l.classList.add('bad');r.classList.add('bad');
      setTimeout(function(){l.classList.remove('bad');r.classList.remove('bad')},500)}
  }});
}
function write(w){
  stage.innerHTML=head()+'<div class="meta">'+(i+1)+' of '+order.length+' · '+score+' correct</div><div class="prompt">'+esc(w.tr)+'</div><p class="hint">Type it in English</p><input class="say" id="x" autocomplete="off" autocapitalize="none" spellcheck="false"><div class="fb" id="f" aria-live="polite"></div><div class="row"><button class="btn" id="ck">Check</button><button class="btn ghost" id="sk">Skip</button></div>';
  var x=$('#x');x.focus();
  function check(){if(answered){answered=false;i++;return render()}
    var ok=norm(x.value)===norm(w.en);rec(w,ok);answered=true;if(ok)score++;else missed.push(order[i]);
    $('#f').className='fb '+(ok?'ok':'bad');$('#f').textContent=ok?'Correct!':'Answer: '+w.en;$('#ck').textContent='Next'}
  $('#ck').onclick=check;x.onkeydown=function(e){if(e.key==='Enter')check()};
  $('#sk').onclick=function(){if(!answered){missed.push(order[i]);rec(w,false)}answered=false;i++;render()};
}
function done(){
  var n=order.length,m=missed.length,msg=mode==='cards'?known.size+' of '+n+' known':score+' of '+n+' correct';
  var again=mode==='cards'?order.filter(function(k){return!known.has(k)}):missed;
  stage.innerHTML=head()+'<div class="big">'+esc(msg.split(' ')[0])+'/'+n+'</div><div class="prompt">'+(again.length?'Good round. Let’s repeat the tricky ones.':'You’ve got them all!')+'</div><div class="row">'+(again.length?'<button class="btn" id="r">Practise '+again.length+' tricky word'+(again.length>1?'s':'')+'</button>':'')+'<button class="btn ghost" id="o">Start over</button></div><div class="edit"><button class="btn ghost" id="cp">Скопировать отчёт для учителя</button><textarea id="rp" rows="6" readonly></textarea></div>';
  if(again.length)$('#r').onclick=function(){begin(shuffle(again));render()};
  $('#o').onclick=function(){begin(shuffle(words.map(function(_,k){return k})));render()};
  var bad=(mode==='cards'?again:missed).map(function(k){return words[k].en}),S=stats(),hard=Object.keys(S).filter(function(k){return S[k].w>1&&words.some(function(x){return x.en===k})}).sort(function(x,y){return S[y].w-S[x].w}).slice(0,8).map(function(k){return k+' ('+S[k].w+')'});
  var rp=deck.title+'\n'+(nm()||'—')+' · '+new Date().toLocaleDateString('ru-RU')+'\nРежим: '+{cards:'карточки',quiz:'тест',write:'письмо',match:'сопоставление',def:'определение'}[mode]+'\nРезультат: '+msg.split(' ')[0]+'/'+n+'\nОшибки: '+(bad.join(', ')||'нет')+(hard.length?'\nЧаще всего: '+hard.join(', '):'');
  $('#rp').value=rp;$('#cp').onclick=function(){$('#rp').select();try{navigator.clipboard.writeText(rp)}catch(e){try{document.execCommand('copy')}catch(_){}}this.textContent='Скопировано — отправь учителю'};
}
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){if(b.dataset.m!=='edit'&&mode==='edit')begin();else if(b.dataset.m!=='edit')begin(order.length?undefined:undefined);setMode(b.dataset.m)}});
if(/^#[zu][\w-]+$/.test(location.hash))unpack(location.hash.slice(1)).then(function(d){deck={title:d.t,text:d.x};words=parse(d.x);$('#tabs').querySelector('[data-m=edit]').hidden=true;welcome()}).catch(function(e){edit();$('#e').textContent='Не удалось открыть урок: '+e.message});else edit();
</script>
</body>
</html>
