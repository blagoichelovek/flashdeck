<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashdeck</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E0;--ink:#2B2140;--mute:#6B6080;--card:#FFFFFF;--line:#EBD9BC;--brand:#6B3FD4;--on-brand:#FFFFFF;--sun:#FFC93C;--on-sun:#2B2140;--ok:#0E7A4F;--bad:#C72E35;--shadow:#2B214033;--g1:#FFD6C2;--g2:#D5F0E0;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1C1A18;--ink:#EDE6DA;--mute:#A9A094;--card:#272421;--line:#3E3933;--brand:#D8C3A0;--on-brand:#1E1A14;--sun:#A8864A;--on-sun:#1E1A14;--ok:#93B896;--bad:#E0998F;--shadow:#00000066;--g1:#2A241F;--g2:#1F2022}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1C1A18;--ink:#EDE6DA;--mute:#A9A094;--card:#272421;--line:#3E3933;--brand:#D8C3A0;--on-brand:#1E1A14;--sun:#A8864A;--on-sun:#1E1A14;--ok:#93B896;--bad:#E0998F;--shadow:#00000066;--g1:#2A241F;--g2:#1F2022}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(circle at 0% 0%,var(--g1),transparent 45%),radial-gradient(circle at 100% 15%,var(--g2),transparent 40%),var(--bg) fixed;color:var(--ink);font:400 17px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:18px 20px;max-width:760px;margin:0 auto}
.logo{font:800 22px 'Bricolage Grotesque',sans-serif;margin-right:auto}
.logo span{display:inline-block;background:var(--sun);color:var(--on-sun);border-radius:8px;padding:0 8px;transform:rotate(-3deg)}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{font:700 15px 'DM Sans',sans-serif;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
main{max-width:760px;margin:0 auto;padding:12px 20px 48px;display:flex;flex-direction:column;align-items:center;gap:22px}
h1{font:800 clamp(28px,6vw,40px)/1.1 'Bricolage Grotesque',sans-serif;margin:0;align-self:flex-start}
.meta{color:var(--mute);font-weight:500;align-self:flex-start}
.stack{position:relative;width:min(560px,100%);margin-top:10px}
.stack::before{content:"";position:absolute;inset:0;background:var(--sun);border-radius:28px;transform:rotate(-2.5deg) translateY(10px)}
.card{position:relative;display:block;width:100%;aspect-ratio:3/2;perspective:1200px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
.face{position:absolute;inset:0;display:grid;place-items:center;padding:24px;border-radius:28px;background:var(--card);border:2px solid var(--line);box-shadow:0 18px 40px -20px var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .5s;font:800 clamp(34px,8vw,62px)/1.05 'Bricolage Grotesque',sans-serif;text-align:center;overflow-wrap:anywhere}
.back{transform:rotateY(180deg);background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.card.flip .front{transform:rotateY(-180deg)}
.card.flip .back{transform:rotateY(0)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font:700 17px 'DM Sans',sans-serif;background:var(--brand);color:var(--on-brand);border:2px solid var(--brand);border-radius:14px;padding:13px 24px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.link{font:500 15px 'DM Sans',sans-serif;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.prompt{font:800 clamp(30px,7vw,52px)/1.1 'Bricolage Grotesque',sans-serif;text-align:center;margin:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(560px,100%)}
.opt{font:700 19px 'DM Sans',sans-serif;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:18px 12px;cursor:pointer;min-height:68px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.say{width:min(560px,100%);font:700 24px 'DM Sans',sans-serif;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.fb{min-height:30px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.edit{width:100%;display:flex;flex-direction:column;gap:16px}
.edit label{display:flex;flex-direction:column;gap:6px;font-weight:700}
.edit input,.edit textarea{font:500 17px 'DM Sans',sans-serif;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.hint{color:var(--mute);margin:0;font-size:15px}
.err{color:var(--bad);font-weight:700;margin:0}
[hidden]{display:none!important}
.face small{display:block;font:500 17px/1.3 'DM Sans',sans-serif;margin-top:14px;opacity:.9}
#rp,#lk{font-size:15px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(640px,100%)}
.mc{display:flex;flex-direction:column;gap:10px}
.mt .opt{font-size:17px;padding:14px 8px;min-height:60px;overflow-wrap:anywhere}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 18%,var(--card))}
.opt:disabled{color:var(--ink);cursor:default}
.lt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px;margin:12px 0}
#an{border-bottom:2px dashed var(--line);padding-bottom:10px}
.tl{width:auto;min-width:48px;padding:10px 14px;font-size:22px}
.ks{width:100%;display:flex;flex-direction:column;gap:26px;text-align:left}
.ks h2{font:800 22px/1.2 'Bricolage Grotesque',sans-serif;margin:0 0 8px}
.ks table{border-collapse:collapse;width:100%}
.ks td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;font-size:16px}
.ks .cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.ks ol{margin:0;padding-left:26px}.ks li{margin:8px 0}
.ans{display:none;color:var(--ok);font-weight:700}
.showkeys .ans{display:inline}.showkeys .ln{display:none}
.ln{display:inline-block;border-bottom:1px solid var(--mute);min-width:140px;height:1em;margin-left:6px}
@media print{body{background:#fff;color:#000}header,.noprint{display:none!important}.ks td,.ks li,.ks h2,h1{color:#000}.ans{color:#000}.ks section{break-inside:avoid}.ln{border-color:#000}}
.big{font:800 clamp(56px,14vw,110px)/1 'Bricolage Grotesque',sans-serif}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.face{transition:none}}
.thb{font:700 18px/1 'DM Sans',sans-serif;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:42px;height:42px;cursor:pointer}
.opt:not(:disabled):not(.ok):not(.bad):hover,.thb:hover{border-color:var(--brand)}
.lb{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}.lb td{padding:10px 12px;border-bottom:1px solid var(--line)}.lb tr:last-child td{border-bottom:0}.lb td:first-child{width:2.5em;color:var(--mute)}.lb td:nth-child(3),.lb td:nth-child(4){text-align:right}.lb td:nth-child(4){color:var(--mute)}.lb tr.me{background:color-mix(in srgb,var(--brand) 16%,var(--card));font-weight:700}
.spk{position:absolute;top:14px;right:14px;z-index:2;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}.spk:hover{border-color:var(--brand)}
.lr{display:flex;gap:10px;align-items:center;margin-bottom:10px}.lr .lo{flex:1;text-align:left}#ll{width:100%}details{width:100%}summary{cursor:pointer;font-weight:700;margin:10px 0}
</style>
</head>
<body>
<header>
  <div class="logo"><span>Flash</span>deck</div>
  <nav id="tabs" aria-label="Practice mode" hidden>
    <button data-m="cards">Картки</button><button data-m="quiz">Тест</button><button data-m="write">Письмо</button><button data-m="match">Пари</button><button data-m="def">Визначення</button><button data-m="letters">Літери</button><button data-m="sent" hidden>Речення</button><button data-m="board">Рейтинг</button><button data-m="edit">Редагувати слова</button>
  </nav>
  <button class="thb" id="th" aria-label="Змінити тему"></button>
</header>
<main id="stage"></main>
<script>
var KEY='flashdeck.v1';
var SAMPLE={title:"Success & Hard Work",text:"success - успех | achieving something you wanted\nachievement - достижение | something important you have achieved\ngoal - цель | something you want to achieve\n> She achieved her goal in one year. // She reached her goal in one year. | Она достигла своей цели за один год.\neffort - усилие | the work you put into something\n> It takes a lot of effort to learn a language. | Нужно много усилий, чтобы выучить язык.\nfailure - неудача, провал | not achieving what you wanted\ntalent - талант | a natural ability\nskill - навык | an ability you develop through practice\nmotivation - мотивация | the reason/energy that makes you act\nexperience - опыт | knowledge gained from doing something\nhard work - тяжёлый труд, работа | putting a lot of effort into something\nambitious - амбициозный | wanting to achieve a lot\ndetermined - целеустремлённый | not giving up easily\nachieve a goal - достичь цели\nwork hard - тяжело работать\ngive up - сдаться\n> Never give up on your dreams. | Никогда не отказывайся от своих мечтаний.\nlearn from your mistakes - учиться на своих ошибках\nreach your potential - реализовать свой потенциал\novercome a problem - преодолеть проблему\nmake progress - прогрессировать\nkeep trying - продолжать пробовать"};
var deck=load()||SAMPLE,words=[],order=[],i=0,mode='edit',dir='en',known=new Set(),score=0,missed=[],answered=false;
var $=function(s){return document.querySelector(s)},stage=$('#stage');
function curTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function paintTheme(){var d=curTheme()==='dark';$('#th').textContent=d?'☀️':'🌙';$('#th').title=d?'Світла тема':'Темна тема'}
try{var _t=localStorage.getItem('flashdeck.theme');if(_t)document.documentElement.dataset.theme=_t}catch(e){}
$('#th').onclick=function(){var t=curTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('flashdeck.theme',t)}catch(e){}paintTheme()};
paintTheme();
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(deck))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function parse(t){var out=[],last=null;t.split(/\n/).forEach(function(l){l=l.trim();if(!l)return;
if(l[0]==='>'){var p=l.slice(1).split(/\s*\|\s*/);if(last&&p.length>1&&p[0].trim()&&p[1].trim())(last.s=last.s||[]).push({en:p[0].trim().split(/\s*\/\/\s*/),tr:p.slice(1).join(' ').trim()});return}
var p=l.split(/\s+[-–—=|]\s+|\t|\s*\|\s*/);if(p.length>1){last={en:p[0].trim(),tr:p[1].trim(),df:p.slice(2).join(' ').trim()};out.push(last)}});return out}
function SN(){var r=[];words.forEach(function(w,k){(w.s||[]).forEach(function(x){r.push({w:k,en:x.en,tr:x.tr})})});return r}
function SI(){return SN().map(function(_,k){return k})}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function q(w){return dir==='en'?w.en:w.tr}
function a(w){return dir==='en'?w.tr:w.en}
function norm(s){return s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ').trim()}
var BASE=location.href.split('#')[0];
function stats(){try{return JSON.parse(localStorage.getItem('flashdeck.stats'))||{}}catch(e){return{}}}
function rec(w,ok){var S=stats(),r=S[w.en]||(S[w.en]={a:0,w:0});r.a++;if(!ok)r.w++;try{localStorage.setItem('flashdeck.stats',JSON.stringify(S))}catch(e){}}
function nm(){try{return localStorage.getItem('flashdeck.name')||''}catch(e){return''}}
var LES='',CUR='',CLS='ALL',full=true,submitted=false;
var SB='https://onjymggpoengivpiskyw.supabase.co/rest/v1/rpc/',SK='sb_publishable_qBGFzK01eYWMq10X0UZMcg_Tr-PUiQF';
function lg(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function rpc(n,b){return fetch(SB+n,{method:'POST',headers:{'apikey':SK,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw new Error(j&&j.message||'error');return j})})}
var SPK=window.speechSynthesis?'<button class="spk" id="sp" aria-label="Озвучити слово">🔊</button>':'';
function say(t){if(!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/\([^)]*\)/g,'').replace(/\s*\/\s*/g,', '));u.lang='en-US';u.rate=.85;var v=speechSynthesis.getVoices().filter(function(x){return /^en[-_]/i.test(x.lang)}),b=v.filter(function(x){return /en[-_](US|GB)/i.test(x.lang)})[0]||v[0];if(b)u.voice=b;speechSynthesis.speak(u)}catch(e){}}
function b64u(b){var s='';b.forEach(function(c){s+=String.fromCharCode(c)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var s=atob(t),u=new Uint8Array(s.length);for(var k=0;k<s.length;k++)u[k]=s.charCodeAt(k);return u}
async function pack(d){var j=new TextEncoder().encode(JSON.stringify(d));if(window.CompressionStream){var r=new Blob([j]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64u(new Uint8Array(await new Response(r).arrayBuffer()))}return 'u'+b64u(j)}
async function unpack(t){var b=unb64u(t.slice(1));if(t[0]==='z'){var r=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));b=new Uint8Array(await new Response(r).arrayBuffer())}return JSON.parse(new TextDecoder().decode(b))}
function slugOf(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)}
function fromFile(h){fetch('lessons/'+h+'.txt',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('урок не знайдено: '+h);return r.text()}).then(function(t){t=t.replace(/^\uFEFF/,'');LES=h;var m=t.match(/^#\s*(.+)\n/);openLesson({t:m?m[1].trim():h,x:m?t.slice(m[0].length):t})}).catch(fail)}
function openSlug(h){rpc('get_lesson',{p_slug:h}).catch(function(){return[]}).then(function(r){if(r&&r.length){LES=h;openLesson({t:r[0].title,x:r[0].body})}else fromFile(h)})}
function home(){
  $('#tabs').hidden=true;LES='';CUR='';var T=lg('flashdeck.secret');
  stage.innerHTML='<h1>Flashdeck</h1><div class="meta">Обери урок</div><div id="ll" class="hint">Завантаження…</div><div class="row" style="justify-content:flex-start"><button class="link" id="mine">Створити свій урок</button><button class="link" id="tch">'+(T?'Вийти (вчитель)':'Вхід для вчителя')+'</button>'+(T?'<button class="link" id="imp">Імпорт із файлу</button>':'')+'</div>';
  $('#mine').onclick=function(){CUR='';edit()};
  $('#tch').onclick=function(){if(T){ls('flashdeck.secret','');home()}else{var v=prompt('Секретне слово вчителя');if(v){ls('flashdeck.secret',v.trim());home()}}};
  if($('#imp'))$('#imp').onclick=function(){var f=prompt('Назва файлу з папки lessons, без .txt (напр. sport-ua)');if(!f)return;f=f.trim();
    fetch('lessons/'+f+'.txt',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('нет файла');return r.text()}).then(function(t){t=t.replace(/^\uFEFF/,'');var m=t.match(/^#\s*(.+)\n/);return rpc('save_lesson',{p_secret:T,p_slug:slugOf(f),p_title:m?m[1].trim():f,p_body:m?t.slice(m[0].length):t})}).then(function(){alert('Імпортовано: '+slugOf(f));home()}).catch(function(e){alert(e.message==='forbidden'?'Невірне секретне слово.':'Не вдалося імпортувати: '+e.message)})};
  rpc('list_lessons',{}).then(function(r){
    if(!r.length){$('#ll').textContent='Поки що немає уроків.';return}
    $('#ll').className='';
    $('#ll').innerHTML=r.map(function(x){return '<div class="lr"><button class="btn ghost lo" data-s="'+esc(x.slug)+'">'+esc(x.title)+'</button>'+(T?'<button class="link" data-e="'+esc(x.slug)+'">Ред.</button><button class="link" data-d="'+esc(x.slug)+'">Видал.</button>':'')+'</div>'}).join('');
    document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){location.hash=b.dataset.s;openSlug(b.dataset.s)}});
    document.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){var sl=b.dataset.e;rpc('get_lesson',{p_slug:sl}).then(function(g){deck={title:g[0].title,text:g[0].body};words=parse(deck.text);CUR=sl;edit()})}});
    document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm('Видалити урок '+b.dataset.d+'?'))rpc('delete_lesson',{p_secret:T,p_slug:b.dataset.d}).then(home).catch(function(e){alert(e.message==='forbidden'?'Невірне секретне слово.':'Помилка видалення')})}})
  }).catch(function(){$('#ll').textContent='Не вдалося завантажити список уроків.'})}
function welcome(){stage.innerHTML=head()+'<div class="meta">'+words.length+' слів і виразів</div><div class="edit"><label>Як тебе звати? (це ім’я буде в рейтингу)<input id="nm" value="'+esc(nm())+'" autocomplete="off"></label><p class="err" id="e"></p><div class="row" style="justify-content:flex-start"><button class="btn" id="st">Почати</button><button class="link" id="hm">← Усі уроки</button></div></div>';$('#hm').onclick=function(){history.replaceState(null,'',location.pathname+location.search);home()};$('#st').onclick=function(){var n=$('#nm').value.trim(),er=$('#e'),go=function(){begin();dir='en';setMode('cards')};ls('flashdeck.name',n);er.textContent='';
if(!n){ls('flashdeck.pid','');return go()}
if(n.length<2){er.textContent='Ім’я має містити від 2 до 20 символів.';return}
rpc('join_class',{p_nick:n,p_class:CLS}).then(function(id){ls('flashdeck.pid',id);go()}).catch(function(e){er.textContent=e.message==='bad nick'?'Ім’я має містити від 2 до 20 символів.':e.message==='bad class'?'Рейтинг ще не налаштований у базі.':'Не вдалося підключитися до рейтингу. Перевір інтернет або залиш ім’я порожнім, щоб грати без рейтингу.'})}}
function onlyDef(){if(mode==='def')order=order.filter(function(k){return words[k].df});if(mode==='letters')order=order.filter(function(k){return !/\s/.test(words[k].en)})}
function setMode(m){mode=m;order=m==='sent'?SI():words.map(function(_,k){return k});onlyDef();$('[data-m=sent]').hidden=!SN().length;$('#tabs').hidden=false;i=0;answered=false;score=0;missed=[];full=true;submitted=false;document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===m)});render()}
function begin(list){order=list||(mode==='sent'?SI():words.map(function(_,k){return k}));i=0;known.clear();score=0;missed=[];full=true;submitted=false;onlyDef()}
function render(){
  if(mode==='edit')return edit();
  if(mode==='keys')return keys();
  if(mode==='board')return board();
  if((mode==='def'||mode==='letters')&&!order.length){stage.innerHTML=head()+'<p class="hint">'+(mode==='def'?'У цьому уроці немає визначень.':'У цьому уроці немає окремих слів без пробілів.')+'</p>';return}
  if(i>=order.length)return done();
  if(mode==='sent')return sent(SN()[order[i]]);
  var w=words[order[i]];
  if(mode==='match')return match();
  if(mode==='def')return def(w);
  if(mode==='letters')return letters(w);
  if(mode==='cards')cards(w);else if(mode==='quiz')quiz(w);else write(w);
}
function board(){
  if(!lg('flashdeck.pid')){

function letters(w){

    stage.innerHTML=head()+'<div class="meta">'+(i+1)+' з '+order.length+' · вірно: '+score+'</div><div class="prompt">'+esc(w.tr)+'</div><p class="hint">Склади слово з літер</p><div class="lt" id="an">'+ans.map(function(k,p){return '<button class="opt tl" data-p="'+p+'">'+esc(ch[k])+'</button>'}).join('')+'</div><div class="lt">'+tl.map(function(k){return ans.indexOf(k)<0?'<button class="opt tl" data-k="'+k+'">'+esc(ch[k])+'</button>':'<button class="opt tl" disabled style="opacity:.25">'+esc(ch[k])+'</button>'}).join('')+'</div><div class="fb" id="f" aria-live="polite"></div><div class="row"><button class="btn ghost" id="sk">Пропустити</button></div>';

    document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){if(answered)return;ans.splice(+b.dataset.p,1);draw()}});
    $('#sk').onclick=function(){if(!answered){missed.push(order[i]);rec(w,false)}nxt()};
  }
  function check(){
    var ok=ans.map(function(k){return ch[k]}).join('').toLowerCase()===src.toLowerCase();rec(w,ok);answered=true;if(ok)score++;else missed.push(order[i]);
    draw();$('#f').className='fb '+(ok?'ok':'bad');$('#f').textContent=ok?'Вірно!':'Не зовсім. Відповідь: '+w.en;$('#sk').textContent='Далі';$('#sk').onclick=nxt}
  draw();

  $('#o').onclick=function(){begin(shuffle(mode==='sent'?SI():words.map(function(_,k){return k})));render()};
  var bad=(mode==='cards'?again:missed).map(function(k){return mode==='sent'?SN()[k].en[0]:words[k].en}),S=stats(),hard=Object.keys(S).filter(function(k){return S[k].w>1&&words.some(function(x){return x.en===k})}).sort(function(x,y){return S[y].w-S[x].w}).slice(0,8).map(function(k){return k+' ('+S[k].w+')'});
  var rp=deck.title+'\n'+(nm()||'—')+' · '+new Date().toLocaleDateString('ru-RU')+'\nРежим: '+{cards:'карточки',quiz:'тест',write:'письмо',match:'сопоставление',def:'определение',letters:'буквы',sent:'предложения'}[mode]+'\nРезультат: '+msg.split(' ')[0]+'/'+n+'\nОшибки: '+(bad.join(', ')||'нет')+(hard.length?'\nЧаще всего: '+hard.join(', '):'');
  $('#rp').value=rp;$('#cp').onclick=function(){$('#rp').select();try{navigator.clipboard.writeText(rp)}catch(e){try{document.execCommand('copy')}catch(_){}}this.textContent='Скопійовано — надішли вчителю'};
}
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){if(b.dataset.m!=='edit'&&mode==='edit')begin();else if(b.dataset.m!=='edit')begin(order.length?undefined:undefined);setMode(b.dataset.m)}});
var H=location.hash.slice(1);
function openLesson(d){deck={title:d.t,text:d.x};words=parse(d.x);$('#tabs').querySelector('[data-m=edit]').hidden=true;welcome()}
function fail(e){edit();$('#e').textContent='Не удалось открыть урок: '+e.message}
if(/^[a-z0-9-]{1,40}$/.test(H))openSlug(H);
else if(/^[zu][\w-]+$/.test(H))unpack(H).then(openLesson).catch(fail);
else home();
</script>
